<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line icons – offline</title><style>
:root{--bg:#fff;--fg:#111;--mut:#737373;--bd:#e5e5e5;--card:#fafafa;--ic-stroke:1.75}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--bd:#262626;--card:#121212}}
body{margin:0;padding:24px;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:22px}h2{font-size:13px;margin:28px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
input{padding:10px 14px;width:100%;max-width:360px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:14px}
.bi{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--ic-stroke);stroke-linecap:round;stroke-linejoin:round;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
.cell:hover{border-color:#ffc107}.cell span{font-size:11px;color:var(--mut);word-break:break-all;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.2s}#toast.on{opacity:1}
